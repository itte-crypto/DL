<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Petualangan Belajar</title>
<style>
:root{--bg:#fdf3dc;--ink:#26204a;--card:#fffdf7;--line:#26204a;--blue:#3b82f6;--org:#f97316;--grn:#16a34a;--sun:#ffc93c;--mute:#6b6590;--soft:#f3ead0;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1738;--ink:#fff4dc;--card:#2a2456;--line:#fff4dc;--mute:#b9b2e0;--soft:#352e6b}}
:root[data-theme="dark"]{--bg:#1b1738;--ink:#fff4dc;--card:#2a2456;--line:#fff4dc;--mute:#b9b2e0;--soft:#352e6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;font-size:16px;line-height:1.45}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:980px;margin:0 auto}
header b{font-size:19px}
main{max-width:980px;margin:0 auto;padding:0 16px 110px}
h1{font-size:clamp(24px,5vw,34px);margin:8px 0}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:12px 0 6px}
p{margin:6px 0}.mute{color:var(--mute);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 0 var(--line)}
.go,.back,.sm,.ad{border:3px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;background:var(--card)}
.go{background:var(--sun);color:#26204a;box-shadow:0 3px 0 var(--line)}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.go:disabled,.sm:disabled{opacity:.45;cursor:not-allowed}
.sm{padding:2px 9px;border-width:2px;border-radius:9px}
.ad{border-style:dashed;width:100%;margin-top:8px;background:transparent}
.danger{color:#b91c1c}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:8px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{resize:vertical}
input[type=number]{width:90px}
label{font-weight:700;display:block;margin-bottom:2px}
label.ck{display:inline-flex;gap:6px;align-items:center;font-weight:400}
.fld{margin:10px 0}.lg{display:flex;gap:6px;align-items:flex-start;margin-top:4px}.fl{background:var(--soft);border:2px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;padding:6px 7px;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:140px}.row>.nf{flex:0 0 auto;min-width:0}
.li{display:grid;gap:10px}.it{border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--soft)}
.it .it{background:var(--card)}
.ib{display:flex;gap:6px;align-items:center;margin-bottom:6px}.sp{flex:1}
details{border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card)}
summary{cursor:pointer;font-weight:700;padding:4px 0}
.pill{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}
.pill.on{background:#bbf7d0;color:#14532d}.pill.off{background:var(--soft)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tabs button{text-align:left;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--card)}
.tabs button small{display:block;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}th,td{border:2px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}th{background:var(--soft)}.tw{overflow-x:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;justify-content:center;z-index:5}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-weight:700;z-index:20;max-width:90vw}
.probs{background:#fee2e2;color:#7f1d1d;border:3px solid #b91c1c;border-radius:14px;padding:10px 16px;margin:12px 0}.probs ul{margin:4px 0 0;padding-left:20px}
.top{display:flex;gap:12px;align-items:center;margin:6px 0;flex-wrap:wrap}
.login{max-width:380px;margin:40px auto;text-align:center}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
</style></head><body>
<header><b>🧑‍🏫 Admin Petualangan Belajar</b><span id="who"></span></header>
<main id="app"></main>
<script>
/* Alamat Google Apps Script (Web app, berakhiran /exec) dan nama berkas game siswa. */
const SYNC='https://script.google.com/macros/s/AKfycbxlOaom3DHLCKEg9h_enfOiVeEi0oBqD9rrojtv7H-Vw1x1CRXlcvO20GWacvDeLaE/exec';
const PLAYER='player.html';

const A=document.getElementById('app');
let CODE='',LS=[],L=null,dirty=0,refs=[];
try{CODE=sessionStorage.getItem('adm_code')||''}catch(e){}

/* ---------- util DOM ---------- */
const h=(tag,a,...c)=>{const e=document.createElement(tag);for(const k in a||{}){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else if(k==='value')e.value=v;else e.setAttribute(k,v)}c.flat().forEach(x=>x!=null&&e.append(x.nodeType?x:document.createTextNode(x)));return e};
const btn=(t,fn,dis,cls)=>{const b=h('button',{type:'button',class:cls||'sm'},t);b.onclick=fn;b.disabled=!!dis;return b};
const touch=()=>{dirty=1;refs.forEach(f=>f())};
const T0=(en,id)=>({en:en||'',id:id||''});
const T1=o=>o&&(o.en||o.id)||'';
const uid=()=>'L'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
let tt;const toast=(t)=>{document.querySelectorAll('.toast').forEach(x=>x.remove());const e=h('div',{class:'toast'},t);document.body.append(e);clearTimeout(tt);tt=setTimeout(()=>e.remove(),2600)};

const inp=(o,k,a)=>{a=a||{};const num=a.type==='number';const e=h('input',Object.assign({type:'text'},a));e.value=o[k]==null?'':o[k];e.oninput=()=>{o[k]=num?(e.value===''?null:+e.value):e.value;touch()};return e};
const bt=(label,o,k,a)=>{a=a||{};if(!o[k])o[k]=T0();
 const f=l=>{const i=a.area?h('textarea',{rows:2}):h('input',{type:'text'});i.value=o[k][l]||'';i.placeholder=l==='en'?'English':'Bahasa Indonesia';i.oninput=()=>{o[k][l]=i.value;touch()};return h('div',{class:'lg'},h('span',{class:'fl'},l.toUpperCase()),i)};
 return h('div',{class:'fld'},label?h('label',{},label):null,a.hint?h('div',{class:'mute'},a.hint):null,f('en'),f('id'))};
const sel=(o,k,opts)=>{const s=h('select');opts.forEach(([v,t])=>s.append(h('option',{value:v},t)));s.value=o[k];s.onchange=()=>{o[k]=s.value;touch()};return s};
const chk=(o,k,label)=>{const c=h('input',{type:'checkbox'});c.checked=!!o[k];c.onchange=()=>{o[k]=c.checked;touch()};return h('label',{class:'ck'},c,label)};
function listEd(arr,mk,row,addLabel,min){
 const box=h('div',{class:'li'});
 const mv=(i,d)=>{const j=i+d;[arr[i],arr[j]]=[arr[j],arr[i]];touch();draw()};
 const draw=()=>{box.innerHTML='';
  arr.forEach((it,i)=>{
   const bar=h('div',{class:'ib'},h('b',{},'#'+(i+1)),h('span',{class:'sp'}),btn('▲',()=>mv(i,-1),i===0),btn('▼',()=>mv(i,1),i===arr.length-1),btn('✕',()=>{arr.splice(i,1);touch();draw()},arr.length<=(min||0),'sm danger'));
   box.append(h('div',{class:'it'},bar,row(it,i)))});
  box.append(btn('＋ '+addLabel,()=>{arr.push(mk());touch();draw()},false,'ad'))};
 draw();return box}

/* ---------- model pelajaran ---------- */
const MT={
 guess:{label:'Kenali & Tebak',desc:'Kartu belajar, lalu siswa menebak gambar yang disebut',icon:'🔎'},
 targets:{label:'Klik target',desc:'Target melayang; siswa klik kiri / kanan / dua kali',icon:'🎈'},
 mouse_buttons:{label:'Tombol mouse',desc:'Klik tombol kiri/kanan pada gambar mouse',icon:'🖱️'},
 quiz:{label:'Pilihan ganda',desc:'Pertanyaan dengan beberapa jawaban',icon:'❓'}};
const ET={
 pair:{label:'Pasangan (pilih → jelaskan)',desc:'Siswa memilih satu hal, lalu memilih fungsi/keterangan yang tepat'},
 multi:{label:'Ceklis lalu bagikan',desc:'Siswa mencentang semua yang bisa dilakukan, lalu memilih satu untuk dibagikan'},
 choose:{label:'Kalimat rumpang',desc:'Satu kalimat dengan satu isian; jawaban benar boleh dikosongkan (refleksi)'}};
const newMission=t=>{
 const base={type:t,icon:MT[t].icon,title:T0(),intro:T0(),done:T0('Great job!','Kamu hebat!'),correct:null,bonus:null};
 if(t==='guess')return Object.assign(base,{learn:true,items:[{name:'',emoji:'',fact:T0()},{name:'',emoji:'',fact:T0()}],intro:T0('Read each name and look at the picture. Then we play a guessing game!','Baca nama dan lihat gambarnya. Lalu kita main tebak!')});
 if(t==='targets')return Object.assign(base,{count:8,targets:[{emoji:'🎈',click:'left',after:'',label:T0(),win:T0()}],intro:T0('Move the mouse to a balloon. Press the **LEFT** button one time.','Gerakkan mouse ke balon. Tekan tombol **KIRI** satu kali.')});
 if(t==='quiz')return Object.assign(base,{questions:[newQ()]});
 return base};
const newQ=()=>({q:T0(),hint:T0(),options:[{t:T0(),ok:true},{t:T0(),ok:false},{t:T0(),ok:false}]});
const newStep=t=>{
 if(t==='pair')return{type:t,template:T0('Today I learned that the {A} is used to {B}.','Hari ini aku belajar bahwa {A} dipakai untuk {B}.'),promptA:T0('Choose one to tell about.','Pilih satu untuk diceritakan.'),promptB:T0('What is the {A} used to do? Choose one.','Untuk apa {A} dipakai? Pilih satu.'),pairs:[{a:T0(),emoji:'',b:T0()},{a:T0(),emoji:'',b:T0()}]};
 if(t==='multi')return{type:t,template:T0('One thing I can do is {X}.','Satu hal yang bisa aku lakukan adalah {X}.'),promptPick:T0('Tap all the things you can do.','Ketuk semua hal yang bisa kamu lakukan.'),promptShare:T0('Now choose ONE to share with the class.','Sekarang pilih SATU untuk dibagikan ke kelas.'),options:[{emoji:'',t:T0()},{emoji:'',t:T0()}]};
 return{type:'choose',template:T0('I think the answer is {X}.','Menurutku jawabannya {X}.'),prompt:T0('Choose one.','Pilih satu.'),options:[{emoji:'',t:T0(),ok:true},{emoji:'',t:T0(),ok:false}]}};
const blank=()=>({v:1,id:uid(),title:'',tab:'',classes:[],published:false,scoring:{correct:1,bonus:2},missions:[],exit:{enabled:false,steps:[]}});
function sample(){
 const L=blank();L.title='Petualangan Mouse';L.tab='Pertemuan 1';L.classes=['3 Aster','3 Gardenia','3 Gloxinia','3 Lavender'];
 const g=newMission('guess');g.icon='🖥️';g.title=T0('Computer Parts','Bagian Komputer');g.items=[
  {name:'Monitor',emoji:'🖥️',fact:T0('The monitor shows pictures and words. It is like the eyes of the computer!','Monitor menampilkan gambar dan tulisan. Seperti mata komputer!')},
  {name:'CPU',emoji:'🗄️',fact:T0('The CPU is the brain of the computer. It is where the computer thinks!','CPU adalah otak komputer. Di sinilah komputer berpikir!')},
  {name:'Keyboard',emoji:'⌨️',fact:T0('The keyboard is used to type letters and numbers.','Keyboard dipakai untuk mengetik huruf dan angka.')},
  {name:'Mouse',emoji:'🖱️',fact:T0('The mouse moves the pointer on the screen and is used to click.','Mouse menggerakkan panah di layar dan dipakai untuk mengklik.')}];
 const mb=newMission('mouse_buttons');mb.title=T0('Mouse Buttons','Tombol Mouse');
 const tg=(icon,ti,click,emoji,count,intro,after)=>{const m=newMission('targets');m.icon=icon;m.title=ti;m.count=count;m.intro=intro;m.targets=[{emoji,click,after:after||'',label:T0(),win:T0()}];return m};
 const l=tg('🎈',T0('Left Click','Klik Kiri'),'left','🎈',8,T0('Move the mouse to a balloon. Press the **LEFT** button one time.','Gerakkan mouse ke balon. Tekan tombol **KIRI** satu kali.'));l.done=T0('Great job using the left click!','Kamu hebat memakai klik kiri!');
 const r=tg('⭐',T0('Right Click','Klik Kanan'),'right','⭐',8,T0('Move the mouse to a star. Press the **RIGHT** button one time.','Gerakkan mouse ke bintang. Tekan tombol **KANAN** satu kali.'));r.done=T0('Great job using the right click!','Kamu hebat memakai klik kanan!');
 const d=tg('🥚',T0('Double Click','Klik Dua Kali'),'double','🥚',6,T0('Move the mouse to an egg. Press the **LEFT** button two times, fast.','Gerakkan mouse ke telur. Tekan tombol **KIRI** dua kali dengan cepat.'),'🐥');d.done=T0('Great job using the double click!','Kamu hebat memakai double click!');d.targets[0].win=T0('It hatched! 🐥','Menetas!');
 const x=newMission('targets');x.icon='🏁';x.title=T0('Mixed Challenge','Tantangan Campuran');x.count=12;x.intro=T0('Read the label under each picture. Choose the right click!','Baca label di bawah gambar. Pilih klik yang sesuai!');x.done=T0('Challenge complete. You are great!','Tantangan selesai. Kamu jago!');
 x.targets=[{emoji:'🎈',click:'left',after:'',label:T0(),win:T0()},{emoji:'⭐',click:'right',after:'',label:T0(),win:T0()},{emoji:'🥚',click:'double',after:'🐥',label:T0(),win:T0()}];
 const q=newMission('quiz');q.icon='💬';q.title=T0('What Did You Notice?','Apa yang Kamu Perhatikan?');q.intro=T0();q.done=T0('You can tell what each click does. Tell your friend!','Kamu bisa menjelaskan fungsi tiap klik. Ceritakan ke temanmu!');
 const mq=(a,b,c,d2,e,f)=>({q:T0(a,b),hint:T0('Think about what you clicked today.','Coba ingat lagi yang tadi kamu klik.'),options:[{t:T0(c,d2),ok:true},{t:T0(e[0],e[1]),ok:false},{t:T0(f[0],f[1]),ok:false}]});
 q.questions=[mq('A single left click is used to…','Klik kiri satu kali dipakai untuk…','choose or press something','memilih atau menekan sesuatu',['show a menu of choices','memunculkan menu pilihan'],['turn off the computer','mematikan komputer']),
  mq('A right click usually…','Klik kanan biasanya…','shows a menu of choices','memunculkan menu pilihan',['types letters','mengetik huruf'],['prints a picture','mencetak gambar']),
  mq('A double click is usually used to…','Double click biasanya dipakai untuk…','open a file or program','membuka file atau program',['close the screen','menutup layar'],['change the keyboard','mengganti keyboard'])];
 L.missions=[g,mb,l,r,d,x,q];
 const p=newStep('pair');p.pairs=[{a:T0('Monitor'),emoji:'🖥️',b:T0('show pictures and words','menampilkan gambar dan tulisan')},{a:T0('CPU'),emoji:'🗄️',b:T0('help the computer think','membantu komputer berpikir')},{a:T0('Keyboard'),emoji:'⌨️',b:T0('type letters and numbers','mengetik huruf dan angka')},{a:T0('Mouse'),emoji:'🖱️',b:T0('move the pointer and click','menggerakkan panah dan mengklik')}];
 const m=newStep('multi');m.template=T0('One mouse action I can do is {X}.','Satu aksi mouse yang bisa aku lakukan adalah {X}.');m.promptPick=T0('Tap all the mouse actions you can do.','Ketuk semua aksi mouse yang bisa kamu lakukan.');
 m.options=[{emoji:'👆',t:T0('left click','klik kiri')},{emoji:'👉',t:T0('right click','klik kanan')},{emoji:'✌️',t:T0('double click','klik dua kali')},{emoji:'↔️',t:T0('move the mouse','menggerakkan mouse')}];
 L.exit={enabled:true,steps:[p,m]};return L}

/* skor */
const sc=m=>({c:m.correct==null?+L.scoring.correct||0:m.correct,b:m.bonus==null?+L.scoring.bonus||0:m.bonus});
const cnt=m=>({guess:(m.items||[]).length,targets:+m.count||0,mouse_buttons:2,quiz:(m.questions||[]).length}[m.type]||0);
const mx=m=>cnt(m)*sc(m).c+sc(m).b;
const maxAll=()=>L.missions.reduce((t,m)=>t+mx(m),0);

function clean(){L.title=(L.title||'').trim();L.tab=(L.tab||'').trim();L.scoring.correct=+L.scoring.correct||0;L.scoring.bonus=+L.scoring.bonus||0;L.missions.forEach(m=>{if(m.type==='targets')m.count=Math.max(0,Math.round(+m.count||0))})}
function validate(){
 const p=[];
 if(!L.title)p.push('Judul pelajaran belum diisi.');
 if(!L.tab||/[\[\]:*?\/\\]/.test(L.tab)||L.tab[0]==='_'||L.tab.length>90)p.push('Nama tab Sheet kosong atau tidak valid (jangan pakai [ ] : * ? / \\ dan jangan diawali _).');
 if(!L.missions.length)p.push('Tambahkan minimal satu misi.');
 L.missions.forEach((m,i)=>{const n='Misi '+(i+1)+': ';
  if(!T1(m.title))p.push(n+'judul masih kosong.');
  if(m.type==='guess'&&(m.items.length<2||m.items.some(x=>!x.name||!x.emoji)))p.push(n+'butuh minimal 2 benda, masing-masing dengan nama dan gambar.');
  if(m.type==='targets'){if(!m.targets.length||m.targets.some(t=>!t.emoji))p.push(n+'setiap target harus punya gambar.');if(!(m.count>=1))p.push(n+'jumlah target minimal 1.')}
  if(m.type==='quiz'){if(!m.questions.length)p.push(n+'belum ada pertanyaan.');m.questions.forEach((q,j)=>{const o=q.options.filter(x=>T1(x.t));if(!T1(q.q)||o.length<2||!o.some(x=>x.ok))p.push(n+'pertanyaan '+(j+1)+' butuh teks, minimal 2 jawaban, dan 1 jawaban benar.')})}});
 if(L.exit.enabled){if(!L.exit.steps.length)p.push('Exit ticket aktif tetapi belum punya langkah.');
  L.exit.steps.forEach((s,j)=>{const n='Exit ticket '+(j+1)+': ';
   if(!T1(s.template))p.push(n+'kalimat belum diisi.');
   if(s.type==='pair'&&(s.pairs.length<2||s.pairs.some(x=>!T1(x.a)||!T1(x.b))))p.push(n+'butuh minimal 2 pasangan yang terisi.');
   if(s.type==='multi'&&s.options.filter(x=>T1(x.t)).length<2)p.push(n+'butuh minimal 2 pilihan.');
   if(s.type==='choose'&&s.options.filter(x=>T1(x.t)).length<2)p.push(n+'butuh minimal 2 pilihan.')})}
 return p}

/* ---------- API ---------- */
async function api(action,data){
 const r=await fetch(SYNC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,code:CODE},data||{}))});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');return j}
const link=l=>new URL(PLAYER+'?l='+encodeURIComponent(l.id),location.href).href;
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('Tautan disalin')}catch(e){prompt('Salin tautan ini:',t)}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- layar: masuk ---------- */
function login(msg){
 A.innerHTML='';
 const i=h('input',{type:'password',autocomplete:'off',placeholder:'Kode admin'});
 const go=async()=>{CODE=i.value;e.textContent='Memeriksa…';try{await load();try{sessionStorage.setItem('adm_code',CODE)}catch(x){}list()}catch(x){CODE='';e.textContent=x.message==='unauthorized'?'Kode salah.':'Tidak bisa terhubung: '+x.message}};
 const e=h('p',{class:'danger'},msg||'');
 i.onkeydown=ev=>{if(ev.key==='Enter')go()};
 A.append(h('div',{class:'card login'},h('div',{style:'font-size:56px'},'🔐'),h('h2',{},'Masuk guru'),h('p',{class:'mute'},'Kode ada di Script properties (ADMIN_CODE) pada Apps Script.'),i,e,btn('Masuk',go,false,'go')));i.focus()}
async function load(){const j=await api('adminList');LS=j.lessons||[]}

/* ---------- layar: daftar ---------- */
function list(){
 dirty=0;L=null;A.innerHTML='';
 A.append(h('h1',{},'Pelajaran saya'));
 const mk=(t,fn)=>{const b=btn(t,fn,false,'go');b.style.marginRight='8px';return b};
 A.append(h('div',{class:'top'},mk('＋ Pelajaran kosong',()=>{L=blank();editor();dirty=1}),mk('＋ Mulai dari contoh “Petualangan Mouse”',()=>{L=sample();editor();dirty=1}),btn('Keluar',()=>{CODE='';try{sessionStorage.removeItem('adm_code')}catch(e){}login()},false,'back')));
 if(!LS.length)A.append(h('div',{class:'card'},h('p',{},'Belum ada pelajaran. Mulailah dari contoh agar kamu melihat bentuknya, lalu ubah sesukamu.')));
 LS.slice().sort((a,b)=>String(b.updated).localeCompare(String(a.updated))).forEach(x=>{
  const l=x.lesson;L=l;const mxs=l.missions?maxAll():0;
  const c=h('div',{class:'card'},
   h('div',{class:'top'},h('h2',{style:'margin:0'},x.title||'(tanpa judul)'),h('span',{class:'pill '+(x.published?'on':'off')},x.published?'Terbit':'Draf')),
   h('p',{class:'mute'},(l.missions||[]).length+' misi · maks ⭐ '+mxs+' · tab Sheet: '+(l.tab||'-')),
   h('div',{class:'top'},btn('✏️ Edit',()=>{L=JSON.parse(JSON.stringify(l));editor()}),btn('👥 Hasil',()=>results(l)),btn('📄 Salin',()=>{L=JSON.parse(JSON.stringify(l));L.id=uid();L.title+=' (salinan)';L.published=false;editor();dirty=1}),
    x.published?btn('🔗 Tautan siswa',()=>copy(link(l))):null,

async function results(l){
